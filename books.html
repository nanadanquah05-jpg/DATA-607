<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Science Fiction Books</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      background-color: #f9f9f9;
      color: #333;
    }
    h1 {
      text-align: center;
      color: #2c3e50;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background-color: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    th {
      background-color: #2c3e50;
      color: white;
      padding: 12px 15px;
      text-align: left;
    }
    td {
      padding: 10px 15px;
      border-bottom: 1px solid #ddd;
    }
    tr:last-child td {
      border-bottom: none;
    }
    tr:nth-child(even) {
      background-color: #f2f2f2;
    }
  </style>
</head>
<body>
  <h1>Science Fiction Books</h1>
  <table id="books-table">
    <thead>
      <tr>
        <th>Title</th>
        <th>Authors</th>
        <th>Year</th>
        <th>Publisher</th>
        <th>ISBN</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Dune</td>
        <td>Frank Herbert</td>
        <td>1965</td>
        <td>Chilton Books</td>
        <td>978-0-441-17271-9</td>
      </tr>
      <tr>
        <td>The Long War</td>
        <td>Terry Pratchett, Stephen Baxter</td>
        <td>2013</td>
        <td>Harper Collins</td>
        <td>978-0-06-206726-8</td>
      </tr>
      <tr>
        <td>Neuromancer</td>
        <td>William Gibson</td>
        <td>1984</td>
        <td>Ace Books</td>
        <td>978-0-441-56956-4</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
